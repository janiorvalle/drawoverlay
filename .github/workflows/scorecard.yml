name: Scorecard

# OpenSSF Scorecard grades the repo's supply-chain posture continuously.
# It only works on public repos; runs fail harmlessly until the flip.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'janiorvalle/drawoverlay'
    permissions:
      contents: read # checkout
      security-events: write # SARIF upload to code scanning
      id-token: write # publishing results to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
